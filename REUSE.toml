# REGELN DIESER DATEI
#   * Passen mehrere [[annotations]] auf eine Datei, gilt die LETZTE (Spec 3.3):
#     Reihenfolge vom Allgemeinen (Eigencode) zum Besonderen (je ext/-Paket),
#     ganz am Ende die Comdare-eigenen Dateien INNERHALB von ext/.
#   * precedence "closest" (Vorgabe): traegt eine Datei selbst SPDX-Angaben,
#     gelten diese (so bleiben die Koepfe von userspace-rcu, liburing,
#     libxlsxwriter, catch.hpp ... massgeblich); nur kopflose Dateien bekommen
