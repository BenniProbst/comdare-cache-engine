#     Kommentar-Anhang traegt; (3) ext/io/liburing/.../io_uring.h, dessen Kopf
#     den von SPDX ZURUECKGEZOGENEN Bezeichner GPL-2.0 traegt -- die Tabelle
#     nennt dieselbe Lizenz mit dem gueltigen Bezeichner GPL-2.0-only. In allen
#     Faellen aendert override die Lizenz NICHT.
#   * Das Git-Submodul ext/queuing/Q01-concurrentqueue ist fuer `reuse lint`
#     keine Covered File; die kuratierte Kopie unter axis_q1_queuing ist es.
#   * Rechtstraeger wie in LICENSE: BEP Venture UG (haftungsbeschraenkt), Marke
#     Comdare; "BEP" allein bezeichnet niemanden.
# PRUEFUNG: `reuse lint` an der Repo-Wurzel (z.B. `uvx --from reuse reuse lint`).
