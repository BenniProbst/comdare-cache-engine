# axis_version.lock -- content-digest tripwire ueber die algo_version-Traeger und die
# Overlay-Quellmenge des Tier-Fingerprints (S-14a Riegel, Task #33/KON17-03; vormals W3-C)
# format: v3
# record (DREI Zeilen je Datei):
#   '<category> <version> <dirname/>'   Kopfzeile; dirname repo-relativ MIT Schluss-'/'
#   '    <basename>'                    Datei-Name (vier Leerzeichen Einrueckung)
#   '    <sha256-hex>'                  Digest (vier Leerzeichen Einrueckung)
# Der volle Pfad ist EXAKT dirname+basename.
#   heuristik: alle *.hpp unter libs/cache_engine/heuristik; version = Integer der EINEN
#              dedizierten '// AXIS_ALGO_VERSION: <N>'-Marker-Zeile.
#   organ/system/mess/tier_substanz: die Quell-Dateien des Overlay-Schnitts
#              (builder/overlay_source_set.hpp -- die Menge, ueber die das Overlay-Glied [7]
#              des Tier-Fingerprints hasht; Endungen kQuellEndungen, kNichtQuellEndungen
#              bewusst draussen). version = geordnete LISTE aller algo_version-String-
#              Literale im Code ('X.Y.Z[.flags]'): N gleiche Literale => der Einzelwert,
#              ungleiche => komma-gefuegt in Text-Reihenfolge; '-' = kein Literal
#              (digest-only).
# KATEGORIE-REGELN: die Kategorie-Spalte wird beim --check gegen die Discovery gehalten
# (Abweichung = ROT). Rueckstufung traeger -> digest-only ist ROT und hat keinen
# --write-Weg; die Aufwertung digest-only -> traeger ist legitim (--check Exit 3, dann
# Regen). Jede Aenderung an einer verzeichneten Datei verlangt den bewussten
# Lock-Regen-Commit (--write); ein Versions-Bump macht ihn legitim, ersetzt ihn nicht.
# Formatwahl v3: der Pfad-SPLIT (dirname auf der Kopfzeile, basename als Folgezeile)
# haelt jede Zeile <=120 Spalten -- die neue Grundgesamtheit traegt Pfade bis 138 Byte,
# die in keine Einzelzeile passen (Diff-Hygiene-Wache voll gedeckt, keine Ausnahme-
# Klasse). v1-/v2-Locks werden beim --check mit klarer Meldung abgewiesen (kein stilles
# Weiterlesen); Kopfzeile ohne BEIDE Folgezeilen = lauter Formatfehler.
