# ── CI-2 (#264/264-b): Voll-Suite-PROBELAUF via Sammel-Target comdare_tests (base-pipeline .test-Template). ──
# CI-6-Konvention: allow_failure bis zum ersten dokumentierten Gruen-Beweis; Hard-Gate erst nach 264-d
# (-j/RAM-Politik CI-5 + #179). Ehrlicher Ist-Stand beim Anlegen (Commit 8669210d): comdare_tests baut
# 788/788; ctest-Vollauf lokal 126/184 passed, 58 Laufzeit-Fails (Inventar im Ledger) -- dieser Job macht
# den Stand pipeline-sichtbar, behauptet aber KEIN Gruen.
# #278 (2026-07-06): HART geschaltet — Einzelfix-Serie 62->0; Gruen-Beweis LITERAL Job 214827
# (Pipeline 8191, 861dce2d): "100% tests passed, 0 tests failed out of 164".
test:unit:
  extends: .test
  tags: [baremetal]
  needs: ["lint:secrets"]
  # R4 (2026-08-06) -- DER WURZELSCHNITT. Bis hierher stand hier die Zeile
  #   COMDARE_TEST_CTEST_ARGS: "-LE contract|pmc"
  # und mit ihr die Behauptung von #278 (2026-07-06), jeder ausgeschlossene contract-Test habe
  # seinen eigenen Job. Die Behauptung hat sich still zersetzt: am 2026-08-06 liefen 9 Tests in
  # KEINEM Job (test_experiment_kern_seam, test_experiment_projection, test_merge_plan_directive,
  # test_experiment_plan_director, test_experiment_dock_payload, test_progress_delta,
  # test_gn_cell_filter, test_org18_persistence_target, test_phase_b_effective_search_algo_contrast).
  # Der contract-Ausschluss faellt damit weg -- er war organisatorisch, nicht technisch (alle
  # contract:*-Jobs konfigurieren mit derselben Flag-Zeile wie dieser Job). Es bleibt der
  # pmc-Ausschluss: Performance-Counter-Hardware, gedeckt von pmc:amd/pmc:intel ueber die KLASSE.
  # Beleg fuer die Unbedenklichkeit (lokal, Bau-Stand dieses Jobs = comdare_tests + Prebuild):
  # "100% tests passed, 0 tests failed out of 39" fuer -L contract, danach 406-Test-Vollauf.
  # Die Auswahl selbst kommt aus dem Manifest; .test baut seine ctest-Zeile aus
  # COMDARE_TEST_CTEST_ARGS, deshalb wird die Variable hier im before_script belegt (das Template
  # laeuft in derselben Shell) statt als YAML-Literal.
  # -- GNU-BAUWEG (08.08.2026, Owner-Ansage; Ledger super :11370-11391) ------------------------
  # DIESER JOB FAEHRT DEN OFFIZIELLEN WEG, NICHT MEHR cmake/ctest DIREKT.
  # Der Owner: "Das einzige auf linux offizielle Verfahren ist ja configure.sh/make/make install
  # oder make check". Ein offizieller Weg, den kein Job faehrt, verrottet unbemerkt -- das ist
  # exakt die Klasse, in der run_all_tests.sh gelandet ist (13x [NOT FOUND] und trotzdem exit 0).
  # Deshalb ERSETZT der GNU-Weg hier den direkten cmake-Aufruf, er steht nicht daneben.
  #
  # ER IST DABEI STRIKT VOLLSTAENDIGER ALS DER ALTE WEG, am Objekt gemessen (ce b2daf9a6):
  #   alter Weg (Prebuild-Handliste + Reconfigure) ... 429 registrierte Tests
  #   'make check' (all + Reconfigure) ............... 431 registrierte Tests
  # Dem alten Weg fehlten f15_compare_cli_smoke und test_v41_anatomy_adhoc_autobuilt_load: die
  # Prebuild-Liste COMDARE_TEST_PREBUILD_TARGET war eine HANDLISTE und damit dieselbe Fehlerklasse,
  # die R4 bei den ctest-Auswahlen beseitigt hat -- sie waechst nach. 'make' baut jedes
  # Codegen-Werkzeug ohne dass eines namentlich gepflegt werden muss.
  #
  # DIE TEST-AUSWAHL BLEIBT DIESELBE QUELLE: 'make check' sourct scripts/ci_test_coverage_manifest.sh
  # und ruft ce_ctest mit der Kennung test_unit -- die Naht aus R4 ist unveraendert, sie wird nur
  # nicht mehr hier im Job, sondern im Makefile gezogen. CTEST_EXTRA reicht allein die
  # Ausgabe-Option fuer den GitLab-Test-Report durch.
  #
  # Was aus dem .test-Template bewusst NACHGEBAUT ist: die g++-15-Praeferenz (Toolchain-Floor
  # V-6iii) und die 4x-Bau-Wiederholung (prod2 earlyoom-Kill, SE-21b/6709248). Beides gehoert zur
  # Job-Umgebung, nicht in den Anwender-Bauweg -- ein Anwender soll kein Retry-Netz brauchen.
  script:
    - |
      set -euo pipefail
      _CC=cc; _CXX=c++
      if command -v gcc-15 >/dev/null 2>&1; then _CC=gcc-15; fi
      if command -v g++-15 >/dev/null 2>&1; then _CXX=g++-15; fi
      echo "GNU-Bauweg: CC=$_CC CXX=$_CXX"
      CC="$_CC" CXX="$_CXX" sh ./configure.sh --with-generator=Ninja --enable-build-tests
      _built=0
      for _a in 1 2 3 4; do
        if make BUILD_JOBS="${CMAKE_BUILD_PARALLEL_LEVEL:-4}"; then _built=1; break; fi
        echo "Bau-Versuch $_a fehlgeschlagen -> ninja-Resume-Retry"
      done
      [ "$_built" = 1 ] || { echo "FEHLER: 'make' nach 4 Versuchen nicht erfolgreich"; exit 4; }
      # D1c (2026-08-09) -- DIESER JOB VEROEFFENTLICHT SEINE INVENTUR.
      # Die Abdeckungs-Wache rechnet ihre Abdeckung gegen 'ctest -N' IHRES EIGENEN Baums.
      # Ein Nenner, der aus derselben Quelle stammt wie die Rechnung, kann nicht bestaetigen,
      # dass er vollstaendig ist -- genau daran scheiterte sie schon einmal (Kopf von
      # scripts/ci_test_coverage_guard.sh: "404 statt 406 ... zu kleiner Wahrheitsbegriff").
      # Deshalb legt dieser Job seine Inventur als GEGENQUELLE ab. Sie geht in
      # build/Testing/, weil das .test-Template dieses Verzeichnis ohnehin als Artefakt
      # einsammelt -- so braucht es KEINE zweite artifacts-Liste, die von der des Templates
      # wegdriften koennte.
      # 'make inventar' zuerst: erst danach sind die codegen-abhaengigen Tests registriert.
      # Die Inventur wird VOR 'make check' geschrieben, damit sie auch dann vorliegt, wenn
      # ein Test faellt -- sie beschreibt die REGISTRIERTE Menge, nicht den Ausgang.
      make inventar BUILD_JOBS="${CMAKE_BUILD_PARALLEL_LEVEL:-4}"
      mkdir -p build/Testing
      ctest --test-dir build -N | sed -n 's/^ *Test *#[0-9][0-9]*: *//p' | LC_ALL=C sort -u \
        > build/Testing/ctest_unit_inventar.txt
      echo "D1c: Inventur veroeffentlicht -- $(wc -l < build/Testing/ctest_unit_inventar.txt) Tests"
      # F1b (2026-08-12): DIE HOST-PROBE REIST NEBEN DER INVENTUR. Die Abdeckungs-Wache
      # vergleicht die Inventur seither KLASSENBEWUSST (avx512f/avx2/basis): eine Differenz,
      # die die Klassenleiter erklaert, ist kein Defekt -- dafuer muss sie die Klasse DIESES
      # Baums kennen, GEMESSEN, nicht behauptet. Publiziert werden exakt die CMakeCache-
      # Zeilen, die die Klassen-Ableitung liest (COMDARE_HOST_RUNS_{AVX2,AVX512F} samt
      # _COMPILED und _EXITCODE) plus HOST=<hostname>. Sie reist im Testing/-Verzeichnis,
      # das das .test-Template ohnehin als Artefakt einsammelt -- bewusst KEINE zweite
      # artifacts-Liste (dieselbe Begruendung wie bei der Inventur direkt darueber).
      # Fail-closed: findet grep keine Zeile, ist dieser Job ROT (set -e) -- eine leere
      # Probe wuerde die Wache sonst mit einer Zahl ohne Gegenstand rechnen lassen.
      grep -E '^COMDARE_HOST_RUNS_(AVX2|AVX512F)(_COMPILED|_EXITCODE)?:' build/CMakeCache.txt \
        > build/Testing/ctest_unit_host_probe.txt
      echo "HOST=$(hostname 2>/dev/null || echo unbekannt)" >> build/Testing/ctest_unit_host_probe.txt
      echo "F1b: Host-Probe veroeffentlicht -- $(wc -l < build/Testing/ctest_unit_host_probe.txt) Zeilen"
      # [HISTORIE] (F4-Nachzug, 2026-08-12) -- der folgende OFFEN-Vermerk ist ERLEDIGT,
      # Wortlaut bewahrt (Doku wird deprecated, nie geloescht): der VERBRAUCHER existiert.
      # Der Stufen-Tausch (Kommentar am stages:-Block oben) legte 'test' vor 'contract',
      # und test:coverage-guard zieht Inventur+Host-Probe seither per needs 'artifacts: true'.
      # OFFEN (eigenes Paket, s. Commit-Bogen): der VERBRAUCHER fehlt noch. test:coverage-guard
      # liegt in Stage 'contract', dieser Job in Stage 'test' -- 'needs' darf nicht auf eine
      # SPAETERE Stage zeigen (nachgerechnet: 17 needs-Kanten im File, 0 vorwaerts). Die
      # Verdrahtung braucht eine Topologie-Entscheidung, keine Zeile hier.
      make check CTEST_EXTRA="--output-junit $(pwd)/ctest-junit.xml"
  variables:
    # Nur noch fuer die artifacts-Pfade des .test-Templates: configure.sh legt per Vorgabe 'build' an.
    COMDARE_TEST_CMAKE_BUILD_DIR: "build"
    # [HISTORIE, von der GNU-Bauweg-Umstellung (08.08.2026) abgeloest -- NICHT geloescht, weil die
    #  Begruendungen weiter gelten und erklaeren, WARUM der neue Weg vollstaendiger sein muss:
    #
    #  COMDARE_TEST_CONFIGURE_FLAGS: "-DCOMDARE_BUILD_TESTS=ON"
    #    -> jetzt './configure.sh --enable-build-tests' (dieselbe Wirkung, offizieller Weg).
    #  COMDARE_TEST_BUILD_TARGET: "comdare_tests"
    #    -> jetzt 'make' (all) + 'make check'. 'all' ist die Obermenge; genau das schliesst die
    #       zwei Loecher, die die Prebuild-Handliste offen liess.
    #  COMDARE_TEST_PREBUILD_TARGET: "comdare_anatomy_codegen_cli comdare_profile_run_facade"
    #    G4a (2026-07-26): "comdare_profile_run_facade ergaenzt. Die Fassade ist EXCLUDE_FROM_ALL und
    #    haengt an keinem Test-Target -- sie wurde in test:unit bislang GAR NICHT uebersetzt
    #    (Blindfleck-Befund: das Objektverzeichnis enthielt nur CXXDependInfo.json). Ein gruener
    #    Vollbau war damit keine Aussage ueber profile_run_entry.hpp." DIESE SORGE IST WEITER
    #    BERECHTIGT und heute besser gedeckt: 'make' baut ALL, und die Fassade haengt am
    #    Planer-Target, das die super-Naht per EXCLUDE_FROM_ALL=FALSE ins ALL zurueckholt.
    #    V-4 (27.07.): comdare_permutation_codegen_cli entfiel mit dem Permutations-Retire.
    #
    #  #278 (2026-07-06, Job 214641): "contract-/pmc-Tests laufen bereits HART in ihren eigenen Jobs
    #  -- im unit-Sammel-Lauf zaehlten sie als 'Not Run' (5x)." Genau dieser Verweis war die
    #  Sollbruchstelle: er galt fuer die 5 Tests von damals und wurde nie wieder nachgerechnet.
    #  Von R4 (06.08.) abgeloest; die Auswahl kommt seither aus dem Manifest und wird von der
    #  Abdeckungs-Wache gegengerechnet -- daran aendert die GNU-Umstellung nichts.]

