# aufgetreten (u.a. contract:axis-version-lock: doppelter YAML-Schluessel machte das Gate faktisch
# tot, s. Kommentar in heuristik/measurement_curve_loader.hpp:7-9). "Inert gegenueber Inhalt, nicht
