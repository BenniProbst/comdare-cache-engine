# algo_version-Bump (F4) -> Exit 1 -> Job ROT. Die Header werden NUR GELESEN; golden/TABU bleiben unberuehrt.
# Nach bewusstem Header-Edit: lokal --write + Lockfile-Regen-Commit (siehe axis_version_lock.cpp Kopf).
#
# ZUSAMMENFUEHRUNG 2026-08-06 (Fehlerklasse "Bestandsfehler unter gruener CI"):
# Dieser Schluessel stand ZWEIMAL in dieser Datei -- hier (GN-8/O-4, 76b6ef01 vom 19.07., bewusst OHNE rules als
# hartes Dauergate) und ein zweites Mal am Dateiende (PAKET W3-C, 7492b2ea, INERT-by-default mit
# 'rules: - if: $COMDARE_AXIS_LOCK_CHECK == "true"'). YAML-Mappings verwerfen bei doppeltem Schluessel
# kommentarlos alles ausser der LETZTEN Definition: die W3-C-Fassung gewann, die Verschaerfung hier war ab
# ihrem ersten Tag wirkungslos. Da COMDARE_AXIS_LOCK_CHECK NIRGENDS gesetzt ist (weder in variables noch in
# der Projekt-/Pipeline-Konfiguration), lief der Tripwire in KEINEM Lauf -- drei Wochen lang, bei gruener
# Pipeline und ohne jedes Signal. Beide Fassungen pruefen dieselbe Invariante mit demselben Werkzeug, es sind
# also NICHT zwei Gates: sie sind hier zu EINER Definition vereinigt, und zwar auf der STRENGEREN der beiden
# Wirkungen -- ohne rules, also unbedingt. Ein opt-in-Gate waere die schwaechere Fassung und ist damit
# bewusst NICHT uebernommen. Gegen die Rueckkehr der Klasse: scripts/ci_yaml_key_guard.sh (Job
# test:coverage-guard) laesst einen doppelten Top-Level-Schluessel nicht mehr unbemerkt durch.
# Configure ohne -DCOMDARE_BUILD_TESTS=ON: add_subdirectory(tools) ist in CMakeLists.txt unbedingt, das
# Tool-Target existiert also auch ohne die Test-Suite (lokal belegt) -- das spart den Test-Configure.
#
# S-14a (2026-08-13, Task #33/KON17-03) -- DIE HARTKODIERTE 6-PFAD-LISTE FAELLT AUS DIESER DATEI:
# sie war Mitursache des Drei-Wochen-Ausfalls oben (eine Grundgesamtheit, die im Job-Script wohnt,
# altert mit jedem neuen Traeger und haengt am YAML-Merge-Verhalten). Das Tool v2 erhebt seine
# Grundgesamtheit SELBST (heuristik-Home + organ-Homes axes/ + topics/queuing/, BESTAND-Zeilen mit
# Nenner im Log) und prueft BIDIREKTIONAL -- auch verwaiste Lock-Eintraege werden ROT (v1 sah sie
# nie: do_check iterierte nur ueber argv). Der Job bleibt EIN unbedingtes Dauergate ohne rules.
