# comdare-cache-engine — GitLab CI/CD (REV 10, 2026-06-25): ci-templates-Lint + PMC-Smoke + Contract
# ─────────────────────────────────────────────────────────────────────────────
# REV 10 (Debug-Befunde Pipeline 6948):
#  - lint:secrets GRÜN (hermetischer gitleaks-Bootstrap real bewiesen).
#  - Artefakt-Object-Storage wirft nach dem Secret-Swap HTTP 500 „invalid argument" auf großen Uploads
#    (das `build/`-Artefakt der cache-engine ist riesig) → build+measure zu EINEM `pmc`-Job gemergt,
#    KEIN build/-Artefakt-Upload (Smoke-Beleg = ctest-Log). [Storage-Fix = Infra, Handoff geschrieben.]
#  - pmc:intel bis zum prod2-Runner-Fix per Variable gegatet (Infra spielt meinen SSH-Key auf prod2).
#  - contract: baut die ABI-Smoke-Tests + exakte ctest-Regex (vorher matchte 'abi' ungebaute Tests).
# measure-PMC bleibt erhalten (perf_event_open, bare-metal); der mehrtägige Voll-Mess-Lauf ist separat.

include:
  - project: 'comdare/cluster/ci-templates'
    ref: development
    file: '/base-pipeline.yml'

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - build
  - sanitize
  # STUFEN-TAUSCH test <-> contract (2026-08-11). Bis hierher lief 'contract' VOR 'test', und
  # genau daran scheiterte die Verdrahtung der dritten Achse der Abdeckungs-Wache: test:unit
  # veroeffentlicht seine Inventur (build/Testing/ctest_unit_inventar.txt), der Verbraucher
  # test:coverage-guard liegt in 'contract' -- und ein 'needs' darf nicht auf eine SPAETERE
  # Stufe zeigen. Der Kommentar in test:unit hielt das seit dem 09.08. als offenen Posten fest
  # ("Die Verdrahtung braucht eine Topologie-Entscheidung, keine Zeile hier").
  # WARUM DER TAUSCH UND NICHT ZWEI PIPELINES: am Objekt nachgerechnet, alle needs-Kanten dieser
  # Datei zeigen auf lint:secrets (Stufe 'lint'), also auf die ERSTE Stufe. Der Tausch macht
  # daher KEINE Kante vorwaerts. Nachgerechnet wird das nicht behauptet, sondern gefahren:
  # scripts/ci_stage_topologie_wache.sh zaehlt Kanten und Vorwaerts-Kanten mit Nenner, und
  # ihr Selbsttest dreht die beiden Stufen in einer Kopie zurueck und FORDERT dort ein Rot.
  # OOM: der Tausch macht die zwei Vollbauten (test:unit, test:coverage-guard) ueber das neue
  # needs strikt seriell statt gleichzeitig -- er verschaerft den dokumentierten Fall nicht,
  # er entschaerft ihn.
  - test           # CI-2 (#264): Voll-Suite via Sammel-Target comdare_tests (Probelauf, s. test:unit)
  - contract
  - chaos          # Stufe 6 (#197, EPIC #186): Mess-Drift-Detektor + Rerun-Gate (Selbstheilung)

# #277/#21 (User 06.07.): ccache-Bestand auf dev-MinIO via runners.cache; projektlokales CCACHE_DIR fuer cache:-Sync.
# CI-REGRESSION 04.08. (Owner-Auftrag): restore_cache 4s (27.07.) -> 150s (04.08.), weil EIN Misch-Key
# vier Objektklassen (gcc-Release/asan/tsan/clang) trug, permanent am 5G-Deckel lief (Major-8-Leichen
# bleiben im LRU) und JEDER Compile-Job pull-push fuhr (bis zu 2 konkurrierende cache-archiver je Key).
# HEILUNG nach dem bewaehrten super-#53-Muster: (a) Klassen-Keys mit je GENAU EINEM Writer
# (gcc-Release=test:unit, asan/tsan/clang=je ihr Job), Konsumenten pull-only via .ccache-pull;
# (b) Key-Rotation '-a8' wirft die toten Major-7-Objekte nach dem ABI-Major-8 weg (einmalige
# Cold-Kosten deklariert); (c) MAXSIZE 5G -> 3G (Zip-Transfer je Job klein halten, super-Vorbild).
cache:
  key: "ccache-$CI_PROJECT_NAME-a8"
  paths: [".ccache"]

variables:
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  CCACHE_MAXSIZE: "3G"
  # PMC-Doktrin (User 23.07.): deklarierte Vendor-Lane-Menge dieses Clusters. Jede deklarierte Lane
  # MUSS ihren pmc-Job gruen bestehen (AND ueber die Deklaration); Fremd-Cluster ueberschreiben per
  # Projekt-/Pipeline-Variable (z.B. "intel" auf intel-only-Clustern) -> verschiffbare Pipeline.
  COMDARE_PMC_LANES: "amd intel"
  GIT_SUBMODULE_STRATEGY: none
  CMAKE_BUILD_PARALLEL_LEVEL: "6"          # User 2026-07-06: 2x6 Kerne bei concurrent=2 (prod1 16C; revidiert 4@8-Kern-cgroup-Aera)
  COMDARE_LINT_PATHS: "libs apps tests adapters benchmark_suite benchmarks"
  # contract: ABI-Contract-Smoke = test_abi_interface (std::map/ABI-Interface-Kontrakt). test_v41_anatomy_module_abi
  # ist der schwerere anatomy-MODULE-Test (eigener Linux-Build) -> gehoert in den vollen Test-Stage/#179-Sweep,
  # NICHT in den Contract-Smoke. (REV 11: vorher zog er den mimalloc-Kettel-Include-Bug rein, jetzt gefixt.)
  # R4 (2026-08-06): die ctest-Auswahl kommt aus dem Manifest (Kennung 'contract'), nicht mehr als
  # Regex-Literal aus dieser Zeile. Das Template .contract fuehrt diesen String per eval in einer
  # Shell aus -- das Laden des Manifests ist deshalb Teil des Kommandos (kein before_script moeglich).
  COMDARE_CONTRACT_CMD: ". ./scripts/ci_test_coverage_manifest.sh && cmake -B build-contract -G Ninja -DCOMDARE_BUILD_TESTS=ON && cmake --build build-contract --target test_abi_interface && ce_ctest contract build-contract --output-on-failure -V"

# ccache-Hygiene (super-#53-Muster): Konsumenten ziehen den gcc-Release-ccache NUR (policy: pull);
# der EINE Writer des Haupt-Keys ist test:unit (Voll-Suite = maximale Objekt-Abdeckung).
.ccache-pull:
  cache:
    key: "ccache-$CI_PROJECT_NAME-a8"
    paths: [".ccache"]
    policy: pull

# ── Stufe 1: Lint (aus ci-templates) ──
lint:secrets:
  extends: .lint-secrets
  tags: [baremetal]
lint:format:
  extends: .lint-format
  tags: [baremetal]
lint:static:
  extends: .lint-static
  tags: [baremetal]
# SF-1 (2026-08-08): Schichtschnitt-Wache -- kein ci-templates-Erbe (das Template lebt in einem ANDEREN
# Projekt), deshalb ein eigenstaendiger Job statt einer .lint-static-Erweiterung. Fasst keine Bau-Artefakte
# an (reiner Text-Scan ueber libs/cache_engine/anatomy/), braucht deshalb kein needs/keine Cache-Vererbung.
lint:layer-includes:
  stage: lint
  tags: [baremetal]
  needs: []
  script:
    - sh scripts/lint_layer_includes.sh

# XML-WOHLGEFORMTHEIT (2026-08-08): am 08.08. lagen VIER getrackte XML dieses Repos nicht
# wohlgeformt im Baum -- darunter all_axes_golden.profile.xml, das golden-Profil der
# Abgabe-Messung. Fehlerklasse in allen Faellen: "--" INNERHALB eines XML-Kommentars (von XML 1.0
# Abschnitt 2.5 ausnahmslos verboten). Nichts hat es gemeldet: es gab keine Wache, die den
# XML-Bestand ueberhaupt ansieht. Zwei der Dateien sind generiert, ihre Generatoren schrieben den
# Defekt mit -- die wurden im selben Commit mitgeheilt, diese Wache faengt den Rueckfall.
# Reiner Parser-Lauf ueber `git ls-files '*.xml'`, keine Bau-Artefakte, deshalb needs: [] und
# kein Cache-Erbe. Fail-closed: fehlt xmllint, wird der Job ROT (rc=2) und nennt das Paket --
# ein stiller Skip waere das Abschalten der Wache (Bissbeweis: 4 Koeder-Klassen + 2 Abbruchwege).
lint:xml-wellformed:
  stage: lint
  tags: [baremetal]
  needs: []
  script:
    - sh scripts/ci_xml_wellformed_guard.sh

# ── Bare-Metal-PMC-Smoke (build+measure in EINEM Job; KEIN großes Artefakt) ──
.bare_metal:
  extends: .ccache-pull   # ccache-Hygiene 04.08.: alle bare-metal-Erben sind Konsumenten (pull-only)
  before_script:
    # R4 (2026-08-06): EIN Ladepunkt fuer die ctest-Auswahlen aller bare-metal-Erben. Die Auswahl
    # eines Jobs steht ab hier NUR NOCH in scripts/ci_test_coverage_manifest.sh -- derselben Datei,
    # aus der die Abdeckungs-Wache (Job test:coverage-guard) ihre Rechnung speist. Job und Wache
    # koennen damit nicht auseinanderlaufen; im Job selbst steht kein Regex mehr.
    - . ./scripts/ci_test_coverage_manifest.sh
    - 'echo "== Host =="; uname -a; (lscpu | grep -E "Vendor ID|Model name") || true'
    - 'echo "== perf_event_paranoid =="; cat /proc/sys/kernel/perf_event_paranoid || true'
    - 'echo "== Toolchain =="; cmake --version; (g++ --version || c++ --version || echo "KEIN C++-Compiler"); (ninja --version || echo "kein ninja")'

# ── #273-T3 (2026-07-07): build:clang-Rollout — ce baut die Voll-Suite unter dem neuesten clang. ──
# clang-22.1.8 ist auf den bare-metal-Runnern vorhanden; lokal comdare_tests EXIT 0 bewiesen (07.07.).
# Der gcc-15.3-Pin (T2) ist SEPARAT + gcc-15.3-gated (HO-11) und NICHT Teil dieses Jobs.
#
# 08.08.2026 -- UNBEDINGT GESCHALTET. Bis heute stand hier "OPT-IN + advisory
# (COMDARE_CLANG_MATRIX==1, wie super-T1): destabilisiert die Hauptpipeline NICHT." Das war
# richtig, solange clang den Baum nicht uebersetzen konnte, und es hatte eine unangenehme
# Folge: die Variable ist in DIESEM Repo nirgends gesetzt, der Job lief also in KEINER
# ce-Pipeline (nachgesehen an 15332: 21 Jobs, kein clang-Job darunter). Ein Gate, das nie
# aufgeht, ist kein Gate -- es ist ein abgeschalteter Job.
# Beide clang-Blocker sind heute geheilt (constexpr-Grammatik ohne Heap; CWG 1430), der
# clang-Vollbau steht mit 1937/1938 und ctest 428/428 auf BEIDEN Compilern. Damit traegt der
# Job und wird scharf geschaltet.
#
# WIE, ohne das Cluster-Repo anzufassen: die rules-Zeile steht in der VORLAGE
# .build-clang-latest (ci-templates base-pipeline.yml:1130-1131, "if $COMDARE_CLANG_MATRIX
# == 1"). ci-templates ist fuer diese Strecke read-only. Ein eigenes rules: im Job
# UEBERSCHREIBT das geerbte vollstaendig -- der Eingriff bleibt damit im eigenen Repo.
#
# ZUR LAST: dieser Job liegt in stage 'build' und laeuft damit VOR test:unit (stage 'test')
# und test:coverage-guard (stage 'contract'). Er trifft die beiden Vollbauten also nicht
# gleichzeitig -- der OOM-Fall von Pipeline 15332 wiederholt sich hier nicht. Er baut
# ausserdem comdare_tests, nicht 'all', und schreibt in einen eigenen ccache-Key.
build:clang:
  extends: .build-clang-latest
  stage: build
  tags: [baremetal]
  rules:
    - when: on_success
  cache:   # ccache-Hygiene 04.08.: eigene Objektklasse (clang) = eigener Key, DIESER Job ist ihr Writer
    key: "ccache-$CI_PROJECT_NAME-clang-a8"
    paths: [".ccache"]
  variables:
    COMDARE_CMAKE_SOURCE_DIR: "."
    COMDARE_AUDIT_BUILD_TYPE: "Release"
    COMDARE_CMAKE_CONFIGURE_FLAGS: "-G Ninja -DCOMDARE_BUILD_TESTS=ON"
    COMDARE_CMAKE_BUILD_TARGET: "comdare_tests"

.pmc:
  extends: .bare_metal
  stage: build
  timeout: 15m   # Härtung 2026-07-09: fail-fast statt 60min-Default. Ein hängender bare-metal-Node (prod2-configure-Hang 08.07., 3×60min verbrannt) failt so nach 15min statt eine Stunde je Pipeline zu blockieren. Normal-Lauf < 3min (configure 0.7s + smoke-Build + ctest).
  needs: ["lint:secrets"]   # Codex-Review 06-27: hart auf den Secrets-Gate warten (sonst läuft Build trotz Leak)
  script:
    # I-PMC-2 (Owner 10.08.2026): die Hardwareform reist als Lane-Variable mit. Beide Lanes sind bereits
    # vendor-getaggt (pmc:amd -> tags [baremetal,amd] -> nur Runner id=16/prod1; pmc:intel -> id=17/prod2),
    # also faehrt hier real AMD- gegen Intel-Hardware -- und damit wird der pmc=<vendor>-Stempel im
    # CEB-Selbst-Stempel auf ECHTER Hardware beider Komponenten gebaut. Ohne den Vendor liefe die
    # Konfiguration in den UEBERGANGS-Warnpfad der Wurzel-CMakeLists (ON ohne Vendor: Messfuehler drin,
    # Stempel schweigt) -- gruen, aber unehrlich.
    # (unquoted: der Wert stammt aus einer GESCHLOSSENEN Menge {amd,intel,leer}, kein Wortbruch moeglich;
    #  leer ist der deklarierte Uebergangszustand und wird von der Wurzel-CMakeLists als solcher gemeldet)
    - cmake -B build -G Ninja -DCOMDARE_BUILD_TESTS=ON -DCOMDARE_ENABLE_PMC=ON -DCOMDARE_PMC_VENDOR=$COMDARE_PMC_VENDOR
    # Build-Parallelität via CMAKE_BUILD_PARALLEL_LEVEL=4 (Runner-Core-Budget, User 2026-06-25), NICHT -j nproc
    # M-CE-25 (Muster-F, 2026-07-13): m3v2_pmc_smoke (Label pmc) lief in KEINEM Job — test:unit schliesst es per
    # -LE pmc aus, kein dedizierter -R matchte es. Es beweist die geschlossene PMC-Naht im Lazy-WIDE-Pfad und
    # gehoert damit in den PMC-Gate. Mit COMDARE_ENABLE_PMC=ON (echte Quelle, available=1) ist der Naht-Beweis
    # scharf (Inversion-Fix: live-PMC = SMOKE_OK). Lokal gruen bewiesen.
    - cmake --build build --target linux_perf_pmc_smoke m3v2_pmc_smoke
    # R4 (2026-08-06): der Lauf-Selektor ist jetzt die KLASSE (Label 'pmc'), nicht mehr eine
    # Namensliste -- Auswahl aus dem Manifest, Kennung 'pmc'. Damit ist die Hardware-Klasse als
    # solche gedeckt: ein neuer pmc-Test faellt nicht mehr zwischen test:unit (-LE pmc) und einer
    # von Hand gepflegten Liste hindurch, sondern wird hier automatisch mitgefahren. Die
    # --target-Liste bleibt bewusst explizit (15m-Timeout, kein Vollbau); fehlt dort ein neuer
    # pmc-Test, meldet ctest die fehlende Binary namentlich -> Job ROT statt stiller Luecke.
    - ce_ctest pmc build --output-on-failure -V
  # KEINE Artefakte: das build/-Tree-Artefakt scheiterte am Object-Storage-500 (post-swap). Beleg = ctest-Log.

# PMC-DOKTRIN (User 2026-07-23, 2 Stufen — Verschiffbarkeit): je Vendor-Maschine ihr eigener
# PMC-Beweis (unsere Smokes = der PMC-Pfad UNSERES Programms), HART fuer jede DEKLARIERTE Lane:
# COMDARE_PMC_LANES deklariert die Maschinen-Menge des Clusters (Default hier: "amd intel" =
# AND, beide Pflicht ohne allow_failure — auf Comdare sind stets beide verfuegbar). Andere
# Cluster verschiffen mit Projekt-/Pipeline-Override (z.B. "intel") -> nur die vorhandene Lane
# wird instanziiert und muss gruen sein (XOR-Verfuegbarkeit), keine Phantom-Pflicht auf nicht
# existente Vendor-Maschinen. Eine deklarierte, aber tote Maschine blockiert EHRLICH (die Lane
# koennte auch nicht messen). Runner-Filter: prod1-Tags nur amd / prod2-Tags nur intel (UND-
# Semantik) — nur die passende Vendor-Maschine kann ihren Job annehmen.
# Probe-Beleg Reaktivierung: Pipeline 12757 pmc:intel=success + pmc:amd=success (23.07.).
# [DEPRECATED-Historie 09.-23.07.: pmc:intel war rules-gated auf COMDARE_PROD2_AVAILABLE wegen
#  prod2-Node-Problemen (Handover docs/sessions/20260709-*); prod2 seit 22.07. dauerhaft gesund.]
# WELLE E (2026-08-07): PMU-EXKLUSIVITAET JE HOST via resource_group. Die PMU (Performance Monitoring
# Unit) ist eine EXKLUSIVE Hardware-Ressource des Runner-Hosts: fahren zwei Pipelines gleichzeitig
# PMC-Jobs auf demselben Host, verfaelschen sich die Zaehler STILL -- die Messung sieht aus wie eine
# Messung, ist aber Ressourcen-Konkurrenz. Belegter Fall (Ledger, Bridge-Rot-Ursache): Pipeline 15157
# gruen vs 15159 rot auf demselben SHA. GitLab-resource_group serialisiert Jobs derselben Gruppe
# projektweit UEBER Pipelines hinweg (genau die Luecke; die Runner-Concurrency allein laesst mehrere
# Jobs je Host zu). Die Gruppe ist bewusst HOST-scoped und NICHT global: pmc:amd kann wegen der
# Tag-UND-Semantik (s.o.) NUR auf prod1 laufen (Runner id=16, Tags prod,baremetal,amd), pmc:intel NUR
# auf prod2 (Runner id=17, Tags prod,baremetal,intel) -- Beleg: Runner-Inventar in
# docs/plaene/20260623-PIVOT-PLAN-156-GITLAB-RUNNER-PROD.md (Abschnitt 2b, LIVE-Runner-Liste).
# Verschiedene Hosts = verschiedene PMUs -> die beiden Lanes duerfen weiter PARALLEL fahren; eine
# globale Gruppe wuerde sie grundlos serialisieren. Alle anderen Jobs bauen mit COMDARE_ENABLE_PMC=OFF
# (CMake-Default, Beleg CMakeLists.txt option-Block) und test:unit faehrt -LE pmc (Manifest) -> nur
# diese zwei Jobs beruehren die PMU, nur sie tragen eine Gruppe.
pmc:amd:
  extends: .pmc
  tags: [baremetal, amd]
  variables:
    COMDARE_PMC_VENDOR: "amd"   # I-PMC-2: die Hardwareform DIESER Lane (Tag amd == prod1 == AuthenticAMD)
  resource_group: pmu-prod1   # Host-Beleg: Tag 'amd' -> nur Runner id=16 (prod1/AMD) nimmt den Job an
  rules:
    - if: '$COMDARE_PMC_LANES =~ /amd/'

pmc:intel:
  extends: .pmc
  tags: [baremetal, intel]
  variables:
    COMDARE_PMC_VENDOR: "intel" # I-PMC-2: die Hardwareform DIESER Lane (Tag intel == prod2 == GenuineIntel)
  resource_group: pmu-prod2   # Host-Beleg: Tag 'intel' -> nur Runner id=17 (prod2/Intel) nimmt den Job an
  rules:
    - if: '$COMDARE_PMC_LANES =~ /intel/'

# ── #270b (2026-07-07): 3-ISA-Teilmatrix-INSTANZIIERUNG — arm64-Smoke auf node7-rpi5-arm64 (tag arm64). ──
# OPT-IN + advisory: die HARTE Scharfschaltung als CI-PFLICHT ist ausdruecklich #276 (letzte Ledger-Aufgabe).
# Dieser Job destabilisiert die Hauptpipeline NICHT (rules-gated auf COMDARE_ISA_MATRIX=="true"), baut nur eine
# kleine, ISA-repraesentative Teilmenge (der cpuid/isa-Probe-Test + das Conformance-Gate) und laeuft ihn — der
# Beweis, dass der arm64-Toolchain-Pfad traegt. Bei node7-Freeze/Toolchain-Luecke: Runner-Endstrecke = Task #23
# (K87b-Montags-Audit); dieser Job bleibt dann instanziiert-aber-ungetriggert (kein Pipeline-Schaden).
build:arm64-smoke:
  stage: test
  tags: [arm64]
  needs: []
  allow_failure: true
  rules:
    - if: '$COMDARE_ISA_MATRIX == "true"'
  script:
    - 'echo "== arm64-Teilmatrix-Smoke auf $(uname -m) =="'
    - 'test "$(uname -m)" = "aarch64" || { echo "FEHLER: kein aarch64-Runner (uname=$(uname -m))"; exit 1; }'
    - _CC=cc; _CXX=c++; command -v g++-13 >/dev/null 2>&1 && { _CC=gcc-13; _CXX=g++-13; }
    - cmake -B build-arm64 -G Ninja -DCMAKE_C_COMPILER="$_CC" -DCMAKE_CXX_COMPILER="$_CXX" -DCOMDARE_BUILD_TESTS=ON
    - cmake --build build-arm64 --target test_cpuid_probe test_conformance_gate
    # R4: Auswahl aus dem Manifest (Kennung 'arm64_smoke'). Dieser Job hat kein .bare_metal-Erbe,
    # laedt das Manifest also selbst. Im Manifest ist er als opt-in deklariert -- die Wache
    # verbucht seine Auswahl NICHT als Abdeckung, solange COMDARE_ISA_MATRIX nicht gesetzt ist.
    - . ./scripts/ci_test_coverage_manifest.sh
    - ce_ctest arm64_smoke build-arm64 --output-on-failure
  artifacts:
    paths: []

# ── Stufe 3b: Sanitize (ASan+UBSan, 10-Stufen-Prinzip P1b) — fängt Memory-/UB-Bugs ──
# advisory (allow_failure) bis #179-Bereinigung, danach HART. Eigener Debug+Sanitizer-Build, kein Artefakt.
# #278 (2026-07-06): HART geschaltet — Gruen-Beweise Pipelines 8190 UND 8191 (2x in Folge success).
sanitize:asan-ubsan:
  extends: .bare_metal
  stage: sanitize
  tags: [baremetal]
  cache:   # ccache-Hygiene 04.08.: eigene Objektklasse (asan/ubsan-Flags) = eigener Key, DIESER Job ist ihr Writer
    key: "ccache-$CI_PROJECT_NAME-asan-a8"
    paths: [".ccache"]
  needs: ["lint:secrets"]   # Codex-Review 06-27: hart auf den Secrets-Gate warten (sonst läuft Build trotz Leak)
  script:
    - cmake -B build-san -G Ninja -DCOMDARE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
    # #204/264-b: Target-Liste um die 5 schnellen, contract-gruen-bewiesenen Gates erweitert (advisory).
    - cmake --build build-san --target test_abi_interface test_config_durability test_conformance_gate test_experiment_driver_v13 test_chaos_drift_gate
    - 'ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ce_ctest sanitize_asan build-san --output-on-failure -V'   # R4: Auswahl aus dem Manifest

# ── Stufe 4: Contract (aus ci-templates; ABI-Smoke eigenständig, kein großes Artefakt) ──
contract:
  extends: [.contract, .ccache-pull]   # ccache-Hygiene 04.08.: Konsument des gcc-Release-Keys (pull-only)
  tags: [baremetal]
  needs: ["lint:secrets"]   # Codex-Review 06-27: hart auf den Secrets-Gate warten (sonst läuft Build trotz Leak)
  artifacts:
    paths: []     # Override: kein build/Testing/-Artefakt (Storage-500 + Pfad-Mismatch zu build-contract)

# -- Stufe 4a: ABDECKUNGS-INVARIANTE (R4, 2026-08-06) -- das Gate ueber die Gates --
# BEFUND, DER DIESEN JOB ERZWINGT: die Jobs dieser Datei waehlen ihre Tests seit jeher ueber
# eigene -R-/-LE-Listen aus. Niemand hat je geprueft, ob die VEREINIGUNG dieser Listen die Menge
# der registrierten Tests trifft. Live gemessen am 2026-08-06 (406 Tests): 9 Tests liefen in
# keinem einzigen Job -- sie wurden in jedem Lauf gebaut, aber nie ausgefuehrt. Es war der zweite
# Durchgang derselben Fehlerklasse (M-CE-25 am 2026-07-13 hatte 21 solcher Tests von Hand
# einsortiert; in drei Wochen waren 9 neue nachgewachsen), weil "Test anlegen" und "Test in einen
# Job eintragen" zwei getrennte Schritte sind und der zweite nirgends erzwungen wurde.
# WAS DIESER JOB TUT: er stellt die Inventur live her (ctest -N auf einem Bau-Baum, der genauso
# konfiguriert ist wie der von test:unit -- inkl. 2-Pass-Codegen-Configure, ohne den zwei Tests
# unregistriert blieben: live 404 statt 406) und haelt sie gegen die Vereinigung aller Auswahlen
# aus scripts/ci_test_coverage_manifest.sh. Bleibt ein Test uebrig, ist der Job ROT und nennt ihn
# beim Namen. Er kann nicht selbst durchs Raster fallen: seine Eingabe ist die Gesamtmenge (ein
# neuer Test ist ohne Zutun Teil der Pruefung), er hat kein rules-Gate und kein allow_failure.
# KEIN Bau der Test-Suite noetig (nur Configure + das Codegen-Tool) -> billig.
# ZUSATZ 2026-08-06: derselbe Job traegt vorgelagert die SCHLUESSEL-WACHE
# (scripts/ci_yaml_key_guard.sh) -- dieselbe Fehlerklasse eine Stufe frueher: nicht "Test ohne
# Job", sondern "Job, den das Parsen kommentarlos verschluckt hat". Kein eigener Job, weil die
# Pruefung kein Bau-Budget braucht und in denselben Runner-Slot passt.
test:coverage-guard:
  extends: .bare_metal
  stage: contract
  tags: [baremetal]
  # ENTZERRUNG (08.08.2026, nach Pipeline 15332 rot): dieser Job baut seit der GNU-Umstellung
  # 'all' statt eines einzelnen Codegen-Ziels -- er ist damit ein VOLLBAU. Zusammen mit dem
  # zweiten Vollbau in test:unit lief er zeitgleich auf demselben Runner (13:37:26 gegen
  # 13:37:55) und cc1plus wurde vom OOM-Killer geholt: "c++: fatal error: Terminated signal
  # terminated program cc1plus". Das war KEIN Compiler- und kein Bauweg-Fehler -- GNU 15.3.0
  # lief korrekt -- sondern Speicherdruck durch zwei parallele Vollbauten.
  # ZUR OOM-ABWEHR, zweiter Anlauf (08.08.2026). Der erste war eine resource_group ueber
  # beide Vollbau-Jobs -- sie hat den Zweck erfuellt und einen SCHLIMMEREN Schaden erzeugt:
  # resource_group serialisiert REPO-WEIT ueber alle Pipelines und Branches, nicht nur
  # innerhalb einer Pipeline. Live beobachtet: drei Pipelines (15352 development, 15349 und
  # 15345 main) standen gleichzeitig auf 'waiting_for_resource', waehrend 15343 baute. Eine
  # Wache, die das ganze Team ausbremst, ist die falsche Wache.
  #
  # STATTDESSEN wird der DRUCK gesenkt statt der Zugriff serialisiert: dieser Job baut mit
  # halber Parallelitaet (BUILD_JOBS unten). Der OOM entstand aus 2 Jobs x 4 gleichzeitigen
  # cc1plus; mit 2 hier bleibt Luft. Zusammen mit der 4x-Wiederaufnahme unten ist ein
  # einzelner earlyoom-Treffer ueberlebbar statt toedlich -- genau dafuer gibt es sie.
  # Der Job ist eine Wache und liegt auf keinem kritischen Pfad: langsamer ist hier billig.
  # DIE ZWEITE KANTE (2026-08-11) -- der VERBRAUCHER, den test:unit seit dem 09.08. als offenen
  # Posten in seinem eigenen Kommentar fuehrte. test:unit schreibt seine Inventur nach
  # build/Testing/ctest_unit_inventar.txt (seit F1b liegt die Host-Probe daneben); das
  # .test-Template veroeffentlicht "${COMDARE_TEST_CMAKE_BUILD_DIR}/Testing/" mit
  # artifacts:when 'always', und test:unit setzt diese Variable auf 'build'. 'artifacts: true'
  # holt die Dateien also in DIESEN Job. Sie landen unter build/Testing/ -- dieser Job baut
  # in build-covguard, es gibt keine Kollision.
  # RICHTIGSTELLUNG (F2, 2026-08-12) -- hier stand, das artifacts-'always' des Templates
  # sichere die Inventur eines ROTEN test:unit. Das verwechselte zwei Mechanismen:
  # artifacts:when regelt NUR den UPLOAD im Erzeuger-Job, es ist KEIN Job-Scheduling.
  # Das Scheduling DIESES Jobs haengt am needs-Default ('on_success'): ein rotes test:unit
  # haette diesen Job samt seiner FUENF vorgelagerten Wachen (Schluessel, Topologie samt
  # Selbsttest, Diff-Hygiene samt Selbsttest, kumulatives Gate, Abdeckung samt Selbsttest)
  # kommentarlos GESKIPPT -- ausgerechnet dann, wenn die Inventur des roten Laufs den
  # Nenner belegen soll. Deshalb der Job-Schluessel direkt unter needs: er laesst diesen
  # Job IMMER fahren; die hochgeladene Inventur des roten test:unit liegt dank des
  # Template-Uploads (s.o.) trotzdem vor.
  # DIE ERSTE KANTE BLEIBT: lint:secrets ist die Konvention der contract-Familie und ein
  # Secrets-Gate, das man nicht gegen eine Inventur eintauscht.
  needs:
    - job: lint:secrets           # Konvention der contract-Familie
    - job: test:unit              # Gegenquelle der dritten Achse (Fremd-Inventur)
      artifacts: true
  when: always
  script:
    # (0) SCHLUESSEL-WACHE ZUERST -- billig (kein Bau, kein Configure) und eine Stufe FRUEHER als
    # die Abdeckungs-Rechnung: ein doppelt vergebener Top-Level-Schluessel loescht kommentarlos
    # eine Job-Definition (YAML: letzte gewinnt), ohne dass irgendetwas rot wird. Die
    # Abdeckungs-Wache darunter wuerde dann eine Pipeline nachrechnen, die es so gar nicht gibt.
    # Erst der BESTAND der Jobs, dann ihre ABDECKUNG. Befund, der das erzwang (2026-08-06):
    # contract:axis-version-lock stand zweimal in dieser Datei -- die zweite, INERT-gegatete
    # Fassung ueberschrieb das unbedingte Gate und legte den Tripwire drei Wochen lang still.
    - sh scripts/ci_yaml_key_guard.sh .gitlab-ci.yml
    # (0.1) STUFEN-TOPOLOGIE (2026-08-11), unmittelbar nach der Schluessel-Wache: dieselbe
    # Familie -- nicht "Test ungedeckt", sondern "die Datei beschreibt eine Pipeline, die es
    # so nicht gibt". Sie rechnet nach, was der Stufen-Tausch dieses Commits behauptet:
    # jede needs-Kante zeigt auf eine Stufe, die nicht SPAETER ist. Gemeldet wird es mit
    # Nenner ("N von M Kanten zeigen VORWAERTS"), damit die Zahl nicht im Kommentar altert.
    #
    # EHRLICH ZUR PLATZIERUNG: eine echte Vorwaerts-Kante weist GitLab schon bei der
    # PIPELINE-ERZEUGUNG ab -- dann laeuft dieser Job gar nicht erst, und die Wache kann
    # nichts melden. Ihr Wert liegt deshalb woanders: sie ist VOR dem Push lokal fahrbar
    # (sh scripts/ci_stage_topologie_wache.sh) und haelt die Kantenbilanz als gefahrene
    # Zahl fest statt als Behauptung. Der Selbsttest direkt darunter beweist ihren Biss.
    - sh scripts/ci_stage_topologie_wache.sh .gitlab-ci.yml
    # (0.2) SELBSTTEST der Stufen-Topologie-Wache. Er dreht die beiden Stufen in einer KOPIE
    # zurueck und FORDERT dort ein Rot mit Namen; danach dreht er sie zurueck und fordert
    # wieder Gruen (Gegenkoeder gegen Dauer-Rot). Dazu drei fail-closed-Faelle: 0 Kanten,
    # unaufloesbare Stufe (gewuerfelter Phantom-Job), Allowlist-Zeile ohne Begruendung.
    # Er braucht keinen Bau-Baum und kostet nichts -- deshalb hier und nicht in einem Job.
    - sh scripts/ci_stage_topologie_wache.selbsttest.sh
    # (0.5) DIFF-HYGIENE-WACHE (2026-08-06, Bestandsaufnahme "ugrep-Gate-Falle"): dieselbe
    # Fehlerklasse eine Stufe hoeher am Objekt -- nicht "Job verschluckt" oder "Test ungedeckt",
    # sondern "der Selbstcheck selbst hat nie gemessen". Das bisherige ASCII/Breite-Verfahren war
    # keine Datei, sondern eine von Hand getippte grep-Kette vor jeder Paketmeldung
    # (`grep -v '^\+\+\+' | grep -P '[^\x00-\x7F]'`) -- sie bricht unter ugrep mit Syntaxfehler ab
    # UND unter echtem GNU grep 3.11 (BRE: \+ ist die "ein-oder-mehr"-Erweiterung, kein Literal;
    # `^\+\+\+` matcht jede Zeile mit fuehrendem '+' und wirft ALLE Zusatzzeilen weg) -- beide Wege
    # enden in einer stillen 0. Hier bewusst NACH der Schluessel-Wache (die prueft, ob diese Datei
    # ueberhaupt intakt geparst wird) und VOR dem Bau (kein Bau-Budget noetig, faellt sofort auf,
    # GitLab stoppt das Script beim ersten Fehl-Exit -- dieselbe Fail-Fast-Eigenschaft wie ein
    # eigener lint-Job, ohne einen zu brauchen). Bereich: CI_MERGE_REQUEST_DIFF_BASE_SHA in
    # MR-Pipelines, sonst CI_COMMIT_BEFORE_SHA (All-Null-Fallback auf HEAD~1 -- neuer Branch/
    # Force-Push). GRENZE, ehrlich benannt: die Skript-LOGIK ist bissgetestet (vier praeparierte
    # Faelle, s. scripts/ci_diff_ascii_width_guard.bissbeweis.txt), die CI-Variablen-Verdrahtung
    # selbst konnte nur syntaktisch (pyyaml, read-only) und nicht in einer echten Pipeline
    # bestaetigt werden -- der erste echte Lauf ist der Beweis dieser einen Stelle.
    #
    # (0.4) SELBSTTEST DER WACHE, VOR ihrem Einsatz (09.08.2026). Die Wache selbst ist ein
    # Werkzeug wie jedes andere und kann still erblinden -- am 09.08. am Objekt belegt: ihr
    # DEFAULT-MODUS verglich gegen den INDEX statt gegen HEAD und sah untracked Dateien gar
    # nicht; wer vor der Pruefung `git add` sagte, bekam "0 Zusatzzeilen ... GRUEN". Der
    # Biss-Beweis konnte das nicht auffangen, weil alle sieben dort protokollierten Faelle
    # ueber --stdin oder einen Bereich laufen und KEINER die Wache ohne Argumente fuhr.
    # Der Selbsttest wuerfelt seinen Koeder bei jedem Lauf neu (kein fest eingetragener
    # Beispielwert, der allowgelistet sein koennte) und faehrt seine Faelle in Wegwerf-Repos
    # unter TMPDIR -- er fasst dieses Repo nicht an. Bewusst VOR der Wache: eine erblindete
    # Wache soll auffallen, bevor ihr Gruen als Beleg gilt.
    # KEINE FALLZAHL AN DIESER STELLE (10.08.2026): hier stand "neun Faelle", waehrend es
    # laengst zwoelf waren und jetzt fuenfzehn sind -- eine nackte Zahl ueber einen
    # wachsenden Gegenstand, die niemand mitzieht. Der Selbsttest druckt seinen Nenner
    # ("N von N Faellen wie erwartet") selbst; der gehoert in seine Ausgabe, nicht hierher.
    - sh scripts/ci_diff_ascii_width_guard.selbsttest.sh
    - |
      set -eu
      _ce_base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      [ -n "$_ce_base" ] || _ce_base="${CI_COMMIT_BEFORE_SHA:-}"
      case "$_ce_base" in
        ""|0000000000000000000000000000000000000000) _ce_base="HEAD~1" ;;
      esac
      echo "DIFF-HYGIENE-WACHE: Bereich ${_ce_base}..HEAD"
      sh scripts/ci_diff_ascii_width_guard.sh "${_ce_base}..HEAD"
    # (0.6) DAS KUMULATIVE GATE (Posten #48, 10.08.2026) -- die Stufe UEBER (0.5).
    #
    # BEFUND, DER ES ERZWINGT: (0.5) misst den PUSH. Am 09.08.2026 stand DERSELBE Baum-SHA
    # aebc4f2c in zwei Laeufen -- 15498 auf development ueber 1 Commit: GRUEN; 15501 auf main
    # ueber 86 Commits: ROT, 58 Verstoesse (37 Nicht-ASCII, 21 ueber 120 Spalten) in zwoelf
    # Dateien. Kein einziger dieser 58 war je in einem Push sichtbar. Der main-FF war das ERSTE
    # kumulative Gate -- und er faellt zu spaet: da ist main schon rot, und ce/main rot macht
    # jede super-Pipeline rot, die 'trigger:cache-engine' (branch: main) feuert.
    #
    # WARUM EIN CI-JOB UND KEIN AUFRUF IM FF-REZEPT (die Entscheidung, begruendet): ein Aufruf
    # im Rezept ist eine PROZEDUR, die jemand vor jedem FF von Hand tippen muss. Genau daraus
    # ist diese Wache entstanden -- ihr Vorgaenger war die handgetippte grep-Kette, die auf
    # jeder grep-Engine still fehlschlug. Eine Prozedur, an die man sich erinnern muss, ist
    # kein Gate. Der lokale Weg bleibt trotzdem moeglich und ist im Kopf der Wache
    # dokumentiert (`--bereich origin/main origin/development`) -- er ERSETZT dieses Gate
    # nicht, er nimmt ihm nur die Ueberraschung.
    #
    # WARUM HIER UND NICHT IN EINEM EIGENEN JOB: dieser Job hat das Werkzeug schon in der Hand
    # und laeuft ohne rules-Gate. Ein eigener Job kostete einen Runner-Slot, und der Owner hat
    # am 10.08.2026 ausdruecklich um WENIGER CI-Last gebeten. Und bewusst VOR dem Vollbau: das
    # Gate faellt in Sekunden, ohne Bau-Budget zu verbrennen.
    #
    # WAS ES KOSTET, GEMESSEN STATT GESCHAETZT (10.08.2026, ce/development 9f932e91 gegen
    # ce/main 1880f296): 21 Commits, 2.462 Zusatzzeilen, 0 Verstoesse -- mit der heutigen
    # Endungs-Liste ebenso wie mit der breiteren Fassung aus fix/hygiene-wache-blacklist.
    # Der Bestand ist also NULL: das Gate ist heute scharf schaltbar, ohne Dauer-Rot und ohne
    # Zuwachs-Sonderregel. Waere die Zahl gross gewesen, stuende hier eine.
    #
    # FAIL-CLOSED an jeder Kante: fehlt der Basis-Zweig im Klon, bricht der Fetch ab und der
    # Job ist ROT -- kein "dann halt ohne". Ein flacher Klon kennt die Abzweigung nicht und
    # wird deshalb vorher entflacht. Und die Wache selbst bricht bei 0 Commits im Bereich ab
    # (gruen mit Nenner 0 ist rot).
    - |
      set -eu
      _ce_ff_basis="${COMDARE_HYG_FF_BASIS:-main}"
      if [ "${CI_COMMIT_BRANCH:-}" = "$_ce_ff_basis" ]; then
        echo "KUMULATIVES GATE: dieser Lauf ist bereits AUF '${_ce_ff_basis}'."
        echo "  Hier IST der Bereich aus (0.5) der kumulative: ein Fast-Forward setzt"
        echo "  CI_COMMIT_BEFORE_SHA auf den ALTEN Stand von '${_ce_ff_basis}', der"
        echo "  Push-Bereich ist also exakt der ganze FF-Bereich (so entstand 15501)."
        echo "  Ein zweiter Lauf waere eine Wiederholung, kein zusaetzliches Urteil."
      else
        _ce_gitdir=$(git rev-parse --git-dir)
        if [ -e "${_ce_gitdir}/shallow" ]; then
          echo "KUMULATIVES GATE: flacher Klon -- wird entflacht (ohne Historie keine Abzweigung)."
          git fetch --no-tags --unshallow origin
        fi
        git fetch --no-tags origin "+refs/heads/${_ce_ff_basis}:refs/remotes/origin/${_ce_ff_basis}"
        sh scripts/ci_diff_ascii_width_guard.sh --bereich "origin/${_ce_ff_basis}" HEAD
      fi
    # Ground Truth = derselbe Bau-Baum wie test:unit, seit 08.08.2026 ueber den GNU-Bauweg.
    #
    # WARUM DIE UMSTELLUNG HIER NOETIG WAR (und nicht nur Symmetrie ist): der alte Weg baute VOR
    # dem Reconfigure nur comdare_anatomy_codegen_cli. Der Kommentar an dieser Stelle nannte das
    # Risiko bereits richtig -- "sonst registriert CMake die codegen-abhaengigen Tests nicht und
    # die Wache haette einen zu kleinen Wahrheitsbegriff" -- aber die Abhilfe war zu klein.
    # Am Objekt gemessen (ce b2daf9a6): ein Prebuild-Ziel + Reconfigure registriert 429 Tests,
    # 'make' (all) + Reconfigure registriert 431. Die Wache pruefte die Auswahl also gegen eine
    # Inventur, die f15_compare_cli_smoke und test_v41_anatomy_adhoc_autobuilt_load selbst nicht
    # kannte -- zwei Tests, die in KEINEM Job liefen, konnten von ihr nicht auffallen. Eine Wache
    # mit unvollstaendigem Nenner meldet Vollstaendigkeit und deckt nichts.
    #
    # 'make' baut jedes Codegen-Werkzeug, ohne dass hier eines namentlich gepflegt werden muss;
    # der ccache traegt den zweiten Vollbau der Pipeline (gemeinsamer Key je Projekt).
    # 'make inventar' ist das projekteigene Ziel, das genau diesen Zustand herstellt (bauen +
    # Reconfigure + Test-Target), OHNE die Tests auszufuehren -- die faehrt test:unit.
    #
    # Die 4x-Wiederholung ist dieselbe wie in test:unit und aus demselben Grund (SE-21b/6709248:
    # earlyoom holt cc1plus, ninja nimmt den Bau danach an der Abbruchstelle wieder auf). Sie
    # fehlte hier zunaechst -- genau daran ist Pipeline 15332 gescheitert. Ein Job, der einen
    # Vollbau macht, braucht das Netz; ein Job, der ein einzelnes Ziel baute, kam ohne aus.
    - |
      set -euo pipefail
      _CC=cc; _CXX=c++
      if command -v gcc-15 >/dev/null 2>&1; then _CC=gcc-15; fi
      if command -v g++-15 >/dev/null 2>&1; then _CXX=g++-15; fi
      # W0a/S6 (10.08.2026): DIESER BAUM LAEDT DEN FIXTURE-PRUEFLING. Der Plugin-Weg
      # COMDARE_CE_PRUEFLINGE existiert seit 29.05.2026 und wurde von KEINEM Job je
      # gefahren -- gemessen: 0 Treffer in jeder .yml/.yaml von ce, super und
      # comdare-prt-art. Der Fall "Gatter = TRUE" war 73 Tage lang erschlossen und nie
      # beobachtet; genau darin konnte die prt-art-Regression unbemerkt reifen.
      # Das Fixture liegt in ce (tests/pruefling_fixture) -- kein Netz, kein Token,
      # kein fremder Klon, KEIN zweiter Vollbau und kein neuer Pipeline-Slot: es haengt
      # ein einzelnes Testziel an den Bau, den dieser Job ohnehin macht.
      # Die Gegenrichtung (kein Pruefling -> Block UEBERSPRUNGEN) faehrt test:unit in
      # derselben Pipeline; beide Zweige sind damit je Lauf belegt (T-4).
      # configure.sh reicht -D<name>=<wert> durch (configure.sh:178, '-D*) anhaengen').
      _pf="$CI_PROJECT_DIR/tests/pruefling_fixture"
      CC="$_CC" CXX="$_CXX" sh ./configure.sh --with-generator=Ninja \
        --enable-build-tests --build-dir=build-covguard -DCOMDARE_CE_PRUEFLINGE="$_pf"
      _built=0
      for _a in 1 2 3 4; do
        if make inventar BUILD_JOBS=2; then _built=1; break; fi   # halbe Parallelitaet: Druck senken statt serialisieren
        echo "Bau-Versuch $_a fehlgeschlagen -> ninja-Resume-Retry"
      done
      [ "$_built" = 1 ] || { echo "FEHLER: 'make inventar' nach 4 Versuchen nicht erfolgreich"; exit 4; }
    # DIE DRITTE ACHSE WIRD SCHARF GESCHALTET (2026-08-11). Die Wache kann die Fremd-Inventur
    # seit dem 09.08. auswerten (COMDARE_FREMD_INVENTUR, fail-closed bei fehlender oder leerer
    # Datei, Abweichung rot MIT NAMEN, eigene Exit-Klasse 4). Gefahren wurde sie NIE: die
    # Variable kam in dieser Datei 0 mal vor (gemessen 11.08., Gegenprobe: 'COMDARE_' 51 mal).
    # Auf jeder bisherigen Pipeline stand deshalb "DRITTE ACHSE (Fremd-Inventur): NICHT
    # GEFAHREN" -- ehrlich gemeldet, aber eben ungefahren. Es fehlte NICHT die Rechnung,
    # es fehlte die LEITUNG: der Erzeuger (test:unit) lag hinter dieser Stufe. Der
    # Stufen-Tausch oben und das needs mit 'artifacts: true' legen sie.
    # HIER am Aufruf und NICHT als Job-Variable: der Selbsttest direkt darunter faehrt den
    # Fall "Variable ungesetzt" als eigenen Fall. Eine Job-Variable waere sein Gegenteil.
    # F1 (2026-08-12): dieselbe Leitung traegt jetzt DREI Auskuenfte -- die Inventur, das
    # SOLL-DELTA und die HOST-PROBE (alle drei am Aufruf, Begruendung oben gilt fort):
    #   * SOLL-DELTA pruefling_slots_v1: DIESER Baum laedt den Fixture-Pruefling (T-4,
    #     Configure oben), test:unit ABSICHTLICH nicht -- test_pruefling_fixture_ladung
    #     ist ein gewollter Unterschied und wird als Block-Kennung DEKLARIERT statt
    #     totgeschwiegen. Ohne die Deklaration waere JEDE Pipeline am Guard rot (W3).
    #   * HOST-PROBE: die Cache-Zeilen des test:unit-Baums (reist im selben Testing/-
    #     Artefakt wie die Inventur). Damit vergleicht die Wache KLASSEN, nicht blind
    #     Mengen -- auf Mischklassen-Runnern erklaert die Klassenleiter die Differenz.
    - COMDARE_FREMD_INVENTUR=build/Testing/ctest_unit_inventar.txt
      COMDARE_FREMD_SOLL_DELTA_BLOECKE=pruefling_slots_v1
      COMDARE_FREMD_HOST_PROBE=build/Testing/ctest_unit_host_probe.txt
      sh scripts/ci_test_coverage_guard.sh build-covguard
    # D1c (2026-08-09): SELBSTTEST der zweiten Achse der Wache oben. Er wuerfelt seinen
    # Koeder bei JEDEM Lauf neu (Schrumpf-Menge aus der echten Inventur) und prueft, dass
    # eine abweichende, eine fehlende und eine leere Gegenquelle je ROT ergeben -- und dass
    # der Gleichstand GRUEN bleibt. Ohne ihn waere die Achse eine Behauptung: eine Wache,
    # deren Biss nie nachgefahren wird, kann still konstant gruen sein.
    # HIER, weil der Selbsttest einen konfigurierten Baum braucht -- build-covguard steht
    # im selben Job schon. Ein eigener Job haette denselben Vollbau zweimal bezahlt.
    - sh scripts/ci_test_coverage_guard.selbsttest.sh build-covguard
    # W-1 (2026-08-08): TEST-SICHTBARKEITS-WACHE -- die Stufe VOR der Abdeckungs-Wache.
    # Die Abdeckungs-Wache oben rechnet die Job-Auswahlen gegen die LIVE-Inventur (ctest -N).
    # Ihr Nenner ist damit genau so gut wie diese Inventur -- und die war es nicht: 27
    # gtest-Faelle aus libs/cache_engine/builder/commands/tests standen ueberhaupt nicht drin,
    # weil enable_testing() in der Wurzel NACH dem add_subdirectory kam. Eine Registrierung,
    # die es nicht in die Inventur schafft, kann von keiner Wache vermisst werden, die auf
    # der Inventur aufsetzt. Diese Wache prueft deshalb die STUFE DAVOR: Quelltext gegen
    # Inventur, Differenz namentlich.
    # HIER und nicht in einem eigenen Job, weil sie einen konfigurierten Bau-Baum braucht --
    # build-covguard ist im selben Job schon gebaut. Ein eigener Job haette denselben
    # Vollbau ein zweites Mal bezahlt.
    - sh scripts/ci_test_sichtbarkeit_wache.sh build-covguard
    # MT-L4 (2026-08-09): TEST-REGISTRIERUNGS-WACHE -- die Stufe VOR der Sichtbarkeits-Wache.
    # Jene vergleicht die Registrierungs-AUFRUFE im CMake-Quelltext gegen `ctest -N`. Eine
    # Test-Quelldatei, die ueberhaupt kein add_test aufruft, steht in ihrem SOLL nie drin und
    # kann von ihr nicht vermisst werden. Genau so lagen vier Dateien 14 bzw. 68 Tage im Repo,
    # ohne je gebaut zu werden; eine davon war beim ersten Lauf sofort rot, eine zweite trug
    # zwei einander widersprechende Erwartungen. Diese Wache nimmt deshalb den Git-Index als
    # SOLL und den GEBAUTEN Baum (build.ninja) als IST -- zwei Quellen, von denen keine die
    # gepruefte CMake-Datei ist.
    # HIER aus demselben Grund wie die beiden Wachen darueber: build-covguard steht im selben
    # Job schon konfiguriert und gebaut. Ein eigener Job haette den Vollbau ein drittes Mal bezahlt.
    - sh scripts/ci_test_registrierungs_wache.sh build-covguard
    # AS-Bewaffnung (2026-08-09): ACHSEN-ROUNDTRIP-WACHE -- genau DREI Registry-Roundtrip-Gates.
    # Warum zusaetzlich zu den drei Wachen oben: die vergleichen alle SOLL gegen IST, wobei der
    # SOLL aus derselben tests/unit/CMakeLists.txt kommt, die geprueft wird. Loescht jemand einen
    # der drei add_test-Bloecke KOMPLETT, sinken SOLL und IST gemeinsam und alle drei bleiben
    # gruen (Selbst-Inventur, V-7). Diese Wache traegt ihren Nenner -- die Drei und die drei
    # Namen -- als Literal im Skript und ist damit die einzige, die eine vollstaendige Loeschung
    # bemerkt.
    - sh scripts/ci_achsen_roundtrip_wache.sh build-covguard
    # D1b/D1e (2026-08-09): BAUWEG-WACHE -- die ZWEITE Haelfte von T-7.
    # T-7 verlangt beides: ein Test existiert erst, wenn er in `ctest -N` erscheint UND
    # sein Binary im Bauweg haengt. Die Wache darueber deckt die erste Haelfte, die
    # Abdeckungs-Wache rechnet Job-Auswahlen gegen die Inventur. Fuer die zweite Haelfte
    # gab es kein Werkzeug: beide bleiben gruen, wenn ein Test sauber registriert ist und
    # sein Binary trotzdem an keinem Sammel-Target haengt. Genau das war D1e
    # (f15_compare_cli_smoke rief comdare_f15_compare_cli auf, das Ziel hing nirgends).
    # Sie vergleicht ZWEI getrennt erzeugte Artefakte (V-7, kein Selbst-Nenner):
    #   CTestTestfile.cmake  -- was ctest aufruft
    #   `ninja -t inputs`    -- was comdare_tests und 'all' herstellen
    # HIER, weil sie einen konfigurierten Baum mit build.ninja braucht -- build-covguard
    # steht im selben Job schon, und zwar NACH `make inventar`. Das ist wesentlich: erst
    # dieser Zustand registriert die codegen-abhaengigen Tests (darunter
    # f15_compare_cli_smoke). Ein Baum ohne `make inventar` prueft weniger; die Wache
    # weist die uebersprungenen Bloecke dann namentlich aus, statt still gruen zu melden.
    - sh scripts/ci_test_bauweg_wache.sh build-covguard
    # Der Selbsttest wuerfelt seinen Koeder bei JEDEM Lauf neu (/dev/urandom) und prueft
    # in einem synthetischen Bau-Baum beide Richtungen: dass "nur an 'all'", "nirgends"
    # und ein fehlendes build.ninja je ROT bzw. Abbruch ergeben -- und dass der saubere
    # Fall und ein blosser Datenpfad GRUEN bleiben. Ohne ihn waere die Wache eine
    # Behauptung: eine Wache, deren Biss nie nachgefahren wird, kann still konstant
    # gruen sein.
    - sh scripts/ci_test_bauweg_wache.selbsttest.sh
  artifacts:
    paths: []     # Storage-500-Konvention der contract-Familie

