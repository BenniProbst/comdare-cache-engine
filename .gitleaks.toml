# gitleaks-Konfiguration -- comdare-cache-engine (CI-Stufe lint:secrets, HART).
#
# VERHAELTNIS ZUR ZENTRALEN BASIS (ci-templates/gitleaks/gitleaks-base.toml): .lint-secrets waehlt
# bei vorhandener Projekt-toml AUSSCHLIESSLICH diese hier (-c ./.gitleaks.toml); die zentrale Basis
# greift dann NICHT. Diese Datei DUPLIZIERT deshalb die Basis-Bloecke -- die Basis-Policy nennt das
# ausdruecklich als eine der beiden erlaubten Varianten -- statt sie per [extend] path zu ziehen:
# ein Pfad-Verweis auf eine nur in CI materialisierte Basis wuerde lokale gitleaks-Laeufe ausserhalb
# der CI brechen. Wer die Basis aendert, zieht hier nach.
#
# OP-3-ZUSCHNITT (27.07.2026): das Projekt-DELTA ist auf NULL geschnitten -- die Bloecke unten sind
# reine Basis-Duplikate. Gestrichen wurden zwei Blanket-Pfade, beide vorher empirisch gegengeprueft
# (gitleaks 8.30.1, Scan gegen den Ist-Baum, Findings jeweils 0):
#   docs/     3.34 MB werden ohne den Eintrag real gescannt und liefern KEIN Finding. Das Blanket
#             hat also nichts abgefangen, haette aber jedes kuenftig in die Doku hineinkopierte
#             echte Secret verdeckt -- genau der Grund, aus dem die zentrale Basis ein
#             Blanket-docs/ bewusst NICHT fuehrt.
#   modules/  deckt heute genau eine getrackte README (2.5 KB), 0 Findings. Die Modul-Spiegel sind
#             geloescht; der Eintrag schuetzte nichts mehr.
# Beide Baeume werden ab jetzt MITGESCANNT. Das ist die Absicht: was dort auftaucht, ist ein echter
# Befund und kein False Positive.
title = "comdare-cache-engine gitleaks"

# --- BASIS-DUPLIKAT (gitleaks-base.toml) -------------------------------------------------------
[extend]
useDefault = true
# `generic-api-key` ist entropie-basiert und wirft auf C++-Doku-Kommentaren systematische
# False-Positives (z.B. `// std::queue-API: peek_front=oldest` -> "Secret" peek_front=oldest).
# Deaktiviert; die 100+ spezifischen High-Confidence-Regeln (aws/github/gcp/azure/private-key/
# slack/stripe/...) bleiben aktiv -> echte Secret-Erkennung erhalten, Rausch-Regel entfernt.
disabledRules = ["generic-api-key"]

# --- BASIS-DUPLIKAT (gitleaks-base.toml) -------------------------------------------------------
# P9-FALLE (empirisch 27.07.): Pfad-Muster IMMER mit '(^|/)'-Praefix verankern. Das weite Muster
# '(^|/)build[^/]*/' traf '/builds/' im absoluten Runner-Pfad und allowlistete den GESAMTEN Scan
# (0-Byte-Gruen). Sicher ist das hier nur zusammen mit dem relativen Scan des Jobs (cd + 'dir .').
[[allowlists]]
description = "Nicht-Quell-/Vendored-/Build-/Dep-Pfade (keine echten Secrets)"
paths = [
  '''(^|/)ext/''',
  '''(^|/)_deps/''',
  '''(^|/)build/''',
  '''(^|/)build-[^/]+/''',
  '''(^|/)cmake-build-[^/]*/''',
  '''(^|/)_archive_code_pre_migration/''',
  '''(^|/)\.citools/''',
  # ccache-Drop 17.08.: Kausalbefund Job 335274 am 27.07. selbentags widerlegt -- git clean
  # raeumt vor Scan, das Watchdog-Gewitter war die Wurzel; seit 10.08. deckelt zudem ein
  # 10-min-Timeout lint:secrets. Der '(^|/)\.ccache/'-Eintrag ist entfernt: .ccache-Pfade
  # werden MITGESCANNT, ein Fund dort ist ein echter Befund.
]

# --- BASIS-DUPLIKAT (gitleaks-base.toml) -------------------------------------------------------
[[allowlists]]
description = "Wert-basierte Pseudo-Secret-Marker (deterministische Testdaten, keine echten Secrets)"
regexTarget = "match"
regexes = [
  '''(?i)(example|dummy|sample|test|fake|placeholder)[-_]?(key|token|secret|pw|password)''',
]

# --- PROJEKT-DELTA (D6 #142, Owner-GO Block D 26.08.2026; Einbau 27.08.2026 im ce-Lande-Zug) -----
# Nackte 32-/64-Byte-Schluessel (WireGuard/X25519/Ed25519/PSK) als base64 nach Private-/Preshared-/
# Secret-Key-Wort bzw. als wg-quick-Konfigurationszeile. Anlass: der WireGuard-Private-Key in der
# super-Historie (0891fcf) wurde von KEINER Default-Regel ausser der hier deaktivierten, entropie-
# basierten generic-api-key gefangen (blinder Fleck). Regeln additiv ([extend] useDefault=true bleibt),
# kein Allowlist-Eingriff. Beleg des Entwurfs: 0 False-Positives ueber 12682 Commits/6 Historien
# (~/backups-workflow/20260825-public-gate/regelbeweis-*.log), Koeder-Suite 6/6 positiv, 0/5 negativ.
# Quelle: entwurf-gitleaks-regel-private-key-base64.toml (Bloecke woertlich uebernommen).
[[rules]]
id = "private-key-base64-32byte"
description = "Nackter 32-Byte-Schluessel (WireGuard/X25519/Ed25519/PSK) als 44-Zeichen-base64 nach 'Private Key:', 'PrivateKey =', 'private_key=', 'PresharedKey ='"
regex = '''(?i)(?:private[ _-]?key|privatekey|preshared[ _-]?key|presharedkey|psk)\b[^\n\r]{0,20}?[:=][ \t]*[`'"]?([A-Za-z0-9+/]{43}=)(?:[`'"\s,;)\]}]|$)'''
secretGroup = 1
entropy = 4.0
keywords = ["private", "preshared", "psk"]

[[rules]]
id = "private-key-base64-64byte"
description = "Nackter 64-Byte-Schluessel (Ed25519-Secret-Key libsodium, NaCl-Box-Paare) als 88-Zeichen-base64 nach Private-Key-/Secret-Key-Wort"
regex = '''(?i)(?:private[ _-]?key|privatekey|secret[ _-]?key|secretkey)\b[^\n\r]{0,20}?[:=][ \t]*[`'"]?([A-Za-z0-9+/]{86}==)(?:[`'"\s,;)\]}]|$)'''
secretGroup = 1
entropy = 4.0
keywords = ["private", "secret"]

[[rules]]
id = "wireguard-conf-privatekey"
description = "WireGuard-/wg-quick-Konfigurationszeile PrivateKey = / PresharedKey = (Datei-Form, auch ohne Wort 'private' im Umfeld)"
regex = '''(?m)^[ \t]*(?:PrivateKey|PresharedKey)[ \t]*=[ \t]*([A-Za-z0-9+/]{43}=)[ \t]*$'''
secretGroup = 1
entropy = 4.0
keywords = ["privatekey", "presharedkey"]
